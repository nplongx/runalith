name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Documentation link and rendered-artifact checks
        run: npm run docs:check

      - name: GitHub Pages source, version and link checks
        run: npm run site:check

      - name: Keep Pages publication fail-closed while release gates are blocked
        run: node --test tests/test-pages-publication-lock.mjs

      - name: Protocol tests
        run: npm run test:protocol

      - name: Workflow-plan and artifact regressions
        run: npm run test:workflow-m4

      - name: Security boundary regressions
        run: |
          node tests/test-secure-filesystem-boundary.js
          node tests/test-worker-filesystem-boundary.js
          node tests/test-execution-verifier.js
          node tests/test-worker-task-strict-json-boundary.js

      - name: External trust-checkpoint contract
        run: node --test tests/test-external-trust-checkpoint-contract.mjs

      - name: Plugin end-to-end acceptance
        run: npm test

      - name: Reproducible package-build contract
        run: npm run test:package-reproducibility

      - name: Whitespace validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            git diff --check HEAD^ HEAD
          fi
